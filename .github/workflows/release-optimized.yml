name: Release Hormachuelos Optimized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimized-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate, build, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production webview
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run cursor regression suites
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Detect release channel
        id: release-channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and publish release-channel installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hormachuelos Optimized v__VERSION__ · Preview Computer Use Beta
          releaseBody: |
            Beta of the independent FPS-focused Windows edition.

            Preview Computer Use v2:
            - visible luminous AI cursor inside the active Preview tab only
            - auto-approved hover, click, type, key, scroll, drag, and wait batches
            - works with project previews and isolated Preview Browser tabs
            - stops on tab switch, Preview close, cancellation, Pause, or Ctrl+Alt+Esc
            - removes native desktop screenshots, mouse/keyboard injection, and the full-screen overlay
            - preserves the optimized chat, Source Lens, Design Mode, session, and model improvements from v1.0.2

            Download page: https://chmoralla-code.github.io/HORMACHUELOS-OPTIMIZED/
          releaseDraft: false
          prerelease: ${{ steps.release-channel.outputs.prerelease }}
          releaseAssetNamePattern: Hormachuelos_Optimized_[version]_x64[setup][ext]
          uploadUpdaterSignatures: false
