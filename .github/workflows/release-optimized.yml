name: Release Hormachuelos Optimized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimized-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate, build, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production webview
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run Ask reliability and prompt-activation guards
        run: npm run test:ask-mode

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run cursor regression suites
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Detect release channel
        id: release_channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and publish release-channel installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hormachuelos Optimized v__VERSION__ · Preview Computer Use Action Fix
          releaseBody: |
            Beta of the independent FPS-focused Windows edition.

            Preview Computer Use reliability:
            - fixes Ask mode exposing observation while silently removing click, hover, type, key, scroll, drag, and wait actions
            - "playwright this website" and equivalent prompts now drive the live Preview before source inspection or test authoring
            - Cursor and direct providers now receive the same Preview-only computer_observe + computer_actions contract
            - adds an executable Ask-mode host-tool round-trip regression to prevent observation-only releases

            Ask Max + Preview Computer Use:
            - Computer Use control in the Preview hamburger menu: Off, Auto, or On
            - Auto recognizes clear Playwright, browser-test, and Preview-debug requests
            - direct “enable/disable computer use” prompts update the visible policy
            - AI cursor remains strictly limited to the active Preview tab
            - silent direct-provider and Cursor completions automatically retry from saved state
            - Ask defaults to Answer Max with stronger evidence synthesis and organized layout
            - stops on tab switch, Preview close, cancellation, Pause, or Ctrl+Alt+Esc
            - preserves all FPS, Source Lens, Design Mode, session, and model improvements

            Download page: https://chmoralla-code.github.io/HORMACHUELOS-OPTIMIZED/
          releaseDraft: false
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          releaseAssetNamePattern: Hormachuelos_Optimized_[version]_x64[setup][ext]
          uploadUpdaterSignatures: false
