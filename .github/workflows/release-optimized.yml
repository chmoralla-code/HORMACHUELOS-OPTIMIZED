name: Release Hormachuelos Optimized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimized-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate, build, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production webview
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run desktop updater guards
        run: npm run test:update
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run Ask reliability and prompt-activation guards
        run: npm run test:ask-mode

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run deterministic AGENTIC routing, permission, persistence, and UI guards
        run: npm run test:agentic

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium for reply layout QA
        run: npx playwright install chromium

      - name: Test AI reply at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.reply.config.mjs

      - name: Test AGENTIC Workbench at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.agentic.config.mjs

      - name: Test the Optimized website release card
        run: npx playwright test --config=playwright.optimized-website.config.mjs

      - name: Run cursor regression suites
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Detect release channel
        id: release_channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $isPrerelease = [bool]($version -match '-(alpha|beta|rc|pre)')
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and publish release-channel installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hormachuelos Optimized v__VERSION__ · Persistent turn transcript
          releaseBody: |
            Every step of a run now stays on the record in Ask mode.

            Status and reasoning steps persist as a compact step log under your message instead of being replaced as work progresses. Status steps render as `› …` rows, streamed reasoning collects into `● …` thought rows, and duplicate consecutive status updates collapse into one row so the log stays readable.

            This release:
            - persists status and reasoning steps for the whole turn in Ask mode
            - renders statuses as `› …` rows and streamed reasoning as `● …` thought rows
            - collapses duplicate consecutive status updates into a single row
            - resets the log with each new message; restored sessions stay unchanged
            - leaves the Build timeline and AGENTIC Execution Workbench untouched
            - keeps Adaptive as the default; this update is not forced

            Remote release gates:
            - AGENTIC Workbench Playwright coverage for live, simple, successful, partial, cancelled, unverified, 390px, and reduced-motion runs
            - deterministic AGENTIC contract guards for routing, permissions, persistence, and release metadata sync
            - TypeScript, production build, FPS, Preview Computer Use, Ask-mode, reply-formatting, Cursor lifecycle, Rust formatting, and Windows native tests

            Windows note:
            - installers are not Authenticode-signed yet, so Windows may show Unknown publisher

            Download page: https://hormachuelos.vercel.app/#/download
          releaseDraft: false
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          releaseAssetNamePattern: Hormachuelos_Optimized_[version]_x64[setup][ext]
          uploadUpdaterSignatures: false

      - name: Publish in-app update feed to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_WHATS_NEW: "Every step of a run now stays on the record in Ask mode. Status and reasoning steps persist as a compact step log under your message instead of being replaced as work progresses. Adaptive remains the default and this update is not forced."
        run: node scripts/publish-update-manifest.mjs --push-pages
