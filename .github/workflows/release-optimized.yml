name: Release Hormachuelos Optimized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimized-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate, build, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production webview
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run Ask reliability and prompt-activation guards
        run: npm run test:ask-mode

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run cursor regression suites
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Detect release channel
        id: release_channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and publish release-channel installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hormachuelos Optimized v__VERSION__ · Reliable Page + Nested Scrolling
          releaseBody: |
            Beta of the independent FPS-focused Windows edition.

            Reliable Preview scrolling:
            - scrolls the nearest movable nested table, list, modal, or page under the AI cursor
            - observed scrollable panes receive refs with current and maximum X/Y positions
            - positive delta_y scrolls down, negative scrolls up, and horizontal panes work too
            - inner panes chain outward at their boundary instead of silently repeating a no-op
            - every scroll reports measured before/after/applied movement, so page scrollY no longer misdiagnoses nested scrolling
            - keeps all scrolling isolated to the active Preview tab with no desktop input access

            Preview tab lifecycle fix:
            - adds Preview-native navigate, open_tab, and activate_tab actions so Computer Use never loses the page to an external browser tab
            - computer_observe now returns safe id/title/URL metadata for all Preview tabs while exposing DOM content only for the active tab
            - switching or navigating is a single bounded action followed by a mandatory fresh observation, preventing stale element refs
            - blocks credential-bearing and non-http(s) navigation and preserves the active-preview-tab-only safety boundary
            - tells every model runtime that open_url launches the external default browser and must never be used for Preview navigation

            Larger, clearer AI cursor:
            - increases the in-page cursor footprint to 48px in project and native Browser previews
            - adds a high-contrast AI label, halo pulse, brighter movement trail, and larger click ripple
            - keeps movement and effects compositor-friendly with transform/opacity animation and pointer-events disabled
            - respects reduced-motion preferences and never renders outside the Preview page

            Ask Max + Preview Computer Use:
            - Computer Use control remains available in the Preview hamburger menu: Off, Auto, or On
            - Auto recognizes clear Playwright, browser-test, and Preview-debug requests
            - "playwright this website" drives the live active Preview before source inspection or test authoring
            - Cursor and direct providers receive the same Preview-only computer_observe + computer_actions contract
            - localhost/127.0.0.1 servers remain routed through the native Preview Browser
            - silent direct-provider and Cursor completions automatically retry from saved state
            - preserves all FPS, Source Lens, Design Mode, session, model, and organized-reply improvements

            Download page: https://chmoralla-code.github.io/HORMACHUELOS-OPTIMIZED/
          releaseDraft: false
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          releaseAssetNamePattern: Hormachuelos_Optimized_[version]_x64[setup][ext]
          uploadUpdaterSignatures: false
