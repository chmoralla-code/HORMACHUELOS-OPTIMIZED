name: Release Hormachuelos Optimized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimized-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate, build, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production webview
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run desktop updater guards
        run: npm run test:update
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run Ask reliability and prompt-activation guards
        run: npm run test:ask-mode

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run deterministic AGENTIC routing, permission, persistence, and UI guards
        run: npm run test:agentic

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium for reply layout QA
        run: npx playwright install chromium

      - name: Test AI reply at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.reply.config.mjs

      - name: Test AGENTIC Workbench at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.agentic.config.mjs

      - name: Test the Optimized website release card
        run: npx playwright test --config=playwright.optimized-website.config.mjs

      - name: Run cursor regression suites
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Detect release channel
        id: release_channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $isPrerelease = [bool]($version -match '-(alpha|beta|rc|pre)')
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and publish release-channel installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hormachuelos Optimized v__VERSION__ · AGENTIC Workbench
          releaseBody: |
            Optional feature release: **AGENTIC Workbench**.

            Adaptive phases:
            - scopes every turn through Ask, Plan, Research, Multi-Agent, and Build
            - skips phases that do not add value and never turns question-, plan-, or research-only requests into writes
            - keeps Adaptive as the default; AGENTIC is separate and opt-in

            Real workers, one writer:
            - creates two or three isolated read-only workers only for independent evidence workstreams
            - uses the selected provider, model, and effort without silent substitution
            - enforces worker read-only permissions at schema and execution time
            - keeps all mutation, integration, repair, verification, and delivery under one Director
            - fans Stop out to queued and active workers and preserves an inspectable partial run

            Execution Workbench:
            - separate Progress, Tools, and Agents lanes replace stacked AGENTIC thought/tool cards
            - wide, narrow-tabbed, and 390px mobile layouts are keyboard accessible and overflow-safe
            - Clearline Markdown answers remain full-width below the lanes
            - terminal runs collapse behind Inspect run and lead with an evidence-backed Delivery Board

            Delivery Board:
            - Outcome, Changes, Verification, Agent Contributions, Risks & Next Actions, and Run facts
            - no inferred verification passes; unverified, partial, failed, and cancelled runs stay honest
            - existing Time Machine, Review changes, Export Client Pack, Copy reply, and feedback actions remain compatible

            Remote release gates:
            - deterministic routing, permission, decomposition, cancellation, concurrency, persistence, and Cursor ownership coverage
            - TypeScript, production build, FPS, Preview Computer Use, Ask-mode, reply-formatting, Cursor lifecycle, Rust formatting, and Windows native tests
            - Playwright live/simple/success/partial/cancelled/unverified Workbench coverage at desktop, narrow, and mobile widths

            Windows note:
            - installers are not Authenticode-signed yet, so Windows may show Unknown publisher

            Download page: https://hormachuelos.vercel.app/#/download
          releaseDraft: false
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          releaseAssetNamePattern: Hormachuelos_Optimized_[version]_x64[setup][ext]
          uploadUpdaterSignatures: false

      - name: Publish in-app update feed to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_WHATS_NEW: Optional AGENTIC Workbench adds adaptive Ask-to-Build phases, up to three real isolated read-only evidence workers, one Director-controlled writer, split Progress/Tools/Agents lanes, and an evidence-backed Delivery Board. Adaptive remains the default and this update is not forced.
        run: node scripts/publish-update-manifest.mjs --push-pages
