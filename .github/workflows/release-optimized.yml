name: Release Hormachuelos Optimized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimized-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate, build, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production webview
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run desktop updater guards
        run: npm run test:update
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run Ask reliability and prompt-activation guards
        run: npm run test:ask-mode

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run deterministic AGENTIC routing, permission, persistence, and UI guards
        run: npm run test:agentic

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium for reply layout QA
        run: npx playwright install chromium

      - name: Test AI reply at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.reply.config.mjs

      - name: Test AGENTIC Workbench at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.agentic.config.mjs

      - name: Test the Optimized website release card
        run: npx playwright test --config=playwright.optimized-website.config.mjs

      - name: Run cursor regression suites
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Detect release channel
        id: release_channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $isPrerelease = [bool]($version -match '-(alpha|beta|rc|pre)')
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and publish release-channel installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hormachuelos Optimized v__VERSION__ · Safe chat rollback
          releaseBody: |
            Independent FPS-focused Windows edition.

            Safe chat rollback in 1.2.16:
            - typing rollback, roll back, revert, or undo now opens the protected Time Machine restoration flow
            - deterministic host routing performs the rollback without calling a model or consuming AI usage
            - Ask mode remains read-only for every ordinary edit; only explicit restoration commands use this path
            - the existing confirmation dialog runs before files are restored
            - newer user edits remain protected as conflicts instead of being overwritten
            - chat reports complete, partial, cancelled, busy, unavailable, and error outcomes clearly
            - Adaptive recognizes rollback as a guarded change request instead of falling back to an unable Ask reply

            Remote release gates:
            - rollback intent tests cover direct commands, polite commands, undo scope, how-to questions, negation, and ambiguous file-scoped requests
            - TypeScript, production Vite build, Ask-mode guards, reply-formatting guards, and Rust formatting
            - Playwright desktop, narrow, and mobile reply-layout coverage plus the v1.2.16 website card
            - Windows native compilation and installer build

            Also included from 1.2.15:
            - Clearline AI replies with section dividers, stronger bold hierarchy, true nested lists, refined code and file chips, and visible reply actions
            - Mission Control, Workspace Time Machine, Test & Fix Everything, Adaptive Director improvements, Gemini CLI support, and Desktop mode

            Windows note:
            - installers are not Authenticode-signed yet, so Windows may show Unknown publisher

            Download page: https://hormachuelos.vercel.app/#/download
          releaseDraft: false
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          releaseAssetNamePattern: Hormachuelos_Optimized_[version]_x64[setup][ext]
          uploadUpdaterSignatures: false

      - name: Publish in-app update feed to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_WHATS_NEW: Type rollback or undo in chat to restore the latest protected AI change through Time Machine without model usage; Ask stays read-only, confirmations remain required, and newer user edits are preserved as conflicts. Includes Clearline AI replies, Mission Control, and Test & Fix Everything.
        run: node scripts/publish-update-manifest.mjs --push-pages
