name: Release Hormachuelos Optimized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimized-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate, build, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production webview
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run desktop updater guards
        run: npm run test:update
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run Ask reliability and prompt-activation guards
        run: npm run test:ask-mode

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium for reply layout QA
        run: npx playwright install chromium

      - name: Test AI reply at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.reply.config.mjs

      - name: Test the Optimized website release card
        run: npx playwright test --config=playwright.optimized-website.config.mjs

      - name: Run cursor regression suites
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Detect release channel
        id: release_channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $isPrerelease = [bool]($version -match '-(alpha|beta|rc|pre)')
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and publish release-channel installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hormachuelos Optimized v__VERSION__ · Clearline AI replies
          releaseBody: |
            Independent FPS-focused Windows edition.

            Clearline AI replies in 1.2.15:
            - adds quiet horizontal dividers before major sections and preserves author-written Markdown rules
            - promotes standalone bold section labels into a stronger, consistent heading hierarchy
            - keeps ordered and unordered sub-points genuinely nested instead of flattening them
            - automatically bolds short lead labels such as Standard view: and Verification:
            - restores compact, safe visual chips for inline code and shortened project filenames
            - adds refined code-language headers, readable callouts, calmer paragraph rhythm, and stronger tables
            - keeps Copy reply visible in a subtle footer separated from the answer by a final hairline
            - maintains safe HTML escaping, responsive overflow protection, and the optimized 20-FPS streaming paint limit

            Remote release gates:
            - reply formatting and transcript stitching regression suite
            - Playwright screenshots and geometry checks at desktop, narrow, and mobile widths
            - dark and light appearance coverage, nested-list indentation, bold weight, divider, file-chip, code, callout, and Copy action checks
            - TypeScript, production Vite build, FPS guards, Ask-mode guards, Computer Use guards, Rust formatting, native tests, and Windows installer build

            Also included from 1.2.14:
            - Mission Control with persistent objective, audience, boundaries, approval policy, execution depth, and definition of done
            - Workspace Time Machine with bounded action evidence, Undo Last, and conflict-aware run rollback
            - Test & Fix Everything with inspect, test, repair, and retest proof states
            - Adaptive Director improvements, maximized mode routing, Gemini CLI support, Client Success tools, and Desktop mode

            Windows note:
            - installers are not Authenticode-signed yet, so Windows may show Unknown publisher

            Download page: https://hormachuelos.vercel.app/#/download
          releaseDraft: false
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          releaseAssetNamePattern: Hormachuelos_Optimized_[version]_x64[setup][ext]
          uploadUpdaterSignatures: false

      - name: Publish in-app update feed to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_WHATS_NEW: Clearline AI replies with section dividers, stronger bold hierarchy, true nested lists, refined code and file chips, responsive visual QA, plus Mission Control, Time Machine, and Test & Fix Everything.
        run: node scripts/publish-update-manifest.mjs --push-pages
