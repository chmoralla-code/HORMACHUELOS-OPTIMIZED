name: Release Hormachuelos Optimized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimized-release
  cancel-in-progress: false

jobs:
  windows-release:
    name: Validate, build, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build production webview
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run Ask reliability and prompt-activation guards
        run: npm run test:ask-mode

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run cursor regression suites
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Detect release channel
        id: release_channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build and publish release-channel installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Hormachuelos Optimized v__VERSION__ · Desktop mode
          releaseBody: |
            Beta of the independent FPS-focused Windows edition.

            Desktop mode:
            - Settings → Agent → Desktop mode is a separate opt-in from Preview Computer Use
            - can drive ordinary Windows apps, including Settings brightness, with the native cursor
            - uses an allowed-apps list, or all ordinary windows when the list is empty
            - blocks password managers, Windows Security, terminals, Run, ChatGPT, Codex, and Hormachuelos
            - shares Ctrl+Alt+Esc with Preview Computer Use as the emergency stop
            - keeps Preview Computer Use Preview-only; Desktop mode does not add overlay FX

            Monochrome active Preview frame:
            - animates a crisp black-to-gray-to-white perimeter only while Computer Use is actively engaged
            - clears the perimeter, AI cursor, target frame, status badge, and particles when the AI finishes, is cancelled, errors, or the user presses Stop
            - keeps the border allocation stable, pauses while backgrounded, honors reduced motion, and uses no blur or backdrop filtering

            Cinematic, readable AI cursor:
            - adds a crisp cyan-violet target frame to every hovered or clicked Preview feature
            - shows approach, hover, press, click, type, key, scroll, drag, success, and boundary states
            - adds bounded motion beads, press compression, concentric click shockwaves, and scroll-direction cues
            - separates the AI action label from the pointer and makes the cursor clearer at 52px
            - yields immediately to trusted human mouse, wheel, or keyboard input, then clears all overlays
            - uses only bounded transform/opacity effects, honors reduced motion, and never leaves the active Preview

            Faster Computer Use:
            - removes cosmetic movement delays from typing, keyboard, and native value actions
            - skips zero-distance motion and uses distance-adaptive 45–120ms cursor travel
            - verifies scrolling immediately, with at most two animation frames when the page updates asynchronously
            - keeps scans, semantic content, trail particles, and transient effects under hard FPS-friendly caps
            - returns compact action and check evidence to reduce model/tool round trips

            Smarter end-to-end Preview QA:
            - observes bounded visible headings, labels, alerts, dialogs, table cells, and status text without starving action refs
            - adds set_value for native date, time, datetime-local, number, range, color, select, text, and contenteditable controls
            - reports native field validity and validation messages instead of abandoning date-picker workflows
            - adds check actions for visible, enabled, checked, text, value, URL, and title evidence
            - a failed check fails the batch, so the model cannot claim a test passed from dispatch alone
            - batches deterministic steps, re-observes only after navigation/layout changes, and avoids blind identical retries
            - Auto recognizes clear Playwright, QA, audit, UI-debug, form, dashboard, game, mouse, and keyboard requests

            Proven Preview control:
            - keeps native open_tab, navigate, and activate_tab support plus reliable page/nested scrolling
            - both project iframes and native Preview Browser run the same native-control, checking, scrolling, and visual behavior tests
            - Computer Use remains auto-approved only inside the active Preview tab; it cannot control the Windows desktop
            - CAPTCHAs, operating-system dialogs, credential-bearing navigation, and other security boundaries remain blocked

            Download page: https://chmoralla-code.github.io/HORMACHUELOS-OPTIMIZED/
          releaseDraft: false
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          releaseAssetNamePattern: Hormachuelos_Optimized_[version]_x64[setup][ext]
          uploadUpdaterSignatures: false
