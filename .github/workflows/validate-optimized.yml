name: Validate Hormachuelos Optimized

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, build, regression guards, and Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build webview bundle
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run cursor persistence guards
        run: node --test scripts/cursor-agent-fallback.test.mjs scripts/cursor-agent-persistence.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check