name: Validate Hormachuelos Optimized

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    name: TypeScript, build, regression guards, and Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build webview bundle
        run: npm run build

      - name: Run FPS regression guards
        run: npm run test:fps
      - name: Run Preview Computer Use isolation guards
        run: npm run test:computer-use

      - name: Run Ask reliability and prompt-activation guards
        run: npm run test:ask-mode

      - name: Run reply-formatting guard
        run: npm run test:reply-formatting

      - name: Run deterministic AGENTIC routing, permission, persistence, and UI guards
        run: npm run test:agentic

      - name: Run cursor persistence guards
        run: node --test scripts/cursor-completion.test.mjs scripts/cursor-bridge-lifecycle.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  native-compile:
    name: Windows native compile
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Prepare compile-only frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -LiteralPath dist/index.html -Value '<!doctype html><title>Native compile check</title>'

      - name: Compile native library
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Run native AGENTIC and regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1


  reply-layout-browser:
    name: AI reply Playwright layout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production reply harness
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test AI reply at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.reply.config.mjs

      - name: Test AGENTIC Workbench at desktop, narrow, and mobile widths
        run: npx playwright test --config=playwright.agentic.config.mjs

      - name: Test the Optimized website release card
        run: npx playwright test --config=playwright.optimized-website.config.mjs

      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reply-and-agentic-layout-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  remote-rustfmt:
    name: Remote-only Rust formatter
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/agentic-workbench-v1.3.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dispatched branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format and commit AGENTIC Rust sources
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "style: format AGENTIC runtime tests"
          git push origin "HEAD:${{ github.ref_name }}"
