name: Remote AGENTIC Rust formatting

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dispatched branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Rust sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "style: format AGENTIC Rust sources"
          git push origin "HEAD:${{ github.ref_name }}"
