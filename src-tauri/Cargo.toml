[package]
name = "ai-forge"
version = "1.0.0"
description = "Independent FPS-optimized Hormachuelos desktop AI studio"
authors = ["AI-Forge"]
edition = "2021"
rust-version = "1.88"
default-run = "ai-forge"
autobins = false

[[bin]]
name = "ai-forge"
path = "src/main.rs"

[[bin]]
name = "export_provider_keys"
path = "src/bin/export_provider_keys.rs"

[[bin]]
name = "seed_key"
path = "src/bin/seed_key.rs"

[lib]
name = "ai_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
directories = "5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
glob = "0.3"
regex = "1"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.58", features = [
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Load frontend from frontendDist (../dist) instead of localhost:1420.
# Without this, plain `cargo build` / debug .exe shows ERR_CONNECTION_REFUSED
# unless `npm run dev` / `cargo tauri dev` is already running.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"